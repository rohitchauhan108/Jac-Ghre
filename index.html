    <!-- Fetch accessor compatibility safeguard for iframe sandbox -->
    <script>
      (function () {
        try {
          var nativeFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = nativeFetch;
          if (typeof window !== 'undefined') {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return currentFetch;
                  },
                  set: function (fn) {
                    currentFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            }
          }
        } catch (e) {
          // ignore error
        }
      })();
    </script>
